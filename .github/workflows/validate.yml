name: validate

on:
  push:
  pull_request:

env:
  # Pinned: validation rules change between releases, so an upstream publish must not
  # turn CI red on an untouched repo. Bump this deliberately, in its own commit.
  CLAUDE_CODE_VERSION: 2.1.261

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate marketplace
        run: claude plugin validate .

      - name: Validate each plugin (parses skill/agent/command files)
        run: |
          python3 -c "
          import json
          m = json.load(open('.claude-plugin/marketplace.json'))
          print('\n'.join(e['source'] for e in m['plugins'] if e['source'].startswith('.')))
          " | while read -r src; do
            echo "::group::claude plugin validate $src"
            claude plugin validate "$src"
            echo "::endgroup::"
          done

      - name: Repo-specific checks
        run: python3 .github/validate.py

      - name: Version bumped when plugin content changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            python3 .github/version-bumped.py "origin/${{ github.base_ref }}"
          else
            python3 .github/version-bumped.py "${{ github.event.before }}"
          fi
